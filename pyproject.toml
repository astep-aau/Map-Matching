[project]
name = "mapmatching"
version = "0.1.0"
description = "Map matching for the aStep multiproject, map matches GPS trips to road segments and sends results to Postgres database."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "psycopg[binary]>=3.2",
]

[project.scripts]
mapmatch = "mapmatching.commands.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapmatching"]